[project]
name = "recon-engine"
version = "0.1.0"
description = "Automated financial reconciliation engine: multi-pass matching into a double-entry ledger"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "cryptography>=43",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.11", "types-openpyxl"]

[tool.setuptools]
packages = ["recon"]

[tool.pytest.ini_options]
addopts = "--cov=recon --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["recon"]
